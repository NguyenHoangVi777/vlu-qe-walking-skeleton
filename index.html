<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
</head>
<body>

    <h2>Đăng nhập</h2>

    <form id="loginForm">
        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >

        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <br><br>

        <button type="submit">Đăng nhập</button>
    </form>

    <p id="result"></p>

    <script src="auth.js"></script>
</body>
</html>
